    <!-- Polyfill guard for cross-fetch / getter-only window.fetch in iframe environments -->
    <script>
      (function() {
        try {
          var target = window;
          var proto = Object.getPrototypeOf(target);
          var desc = Object.getOwnPropertyDescriptor(target, 'fetch');
          var targetObj = target;
          if (!desc && proto) {
            desc = Object.getOwnPropertyDescriptor(proto, 'fetch');
            targetObj = proto;
          }
          if (desc && desc.get && !desc.set) {
            Object.defineProperty(targetObj, 'fetch', {
              get: desc.get,
              set: function(val) {
                Object.defineProperty(this, 'fetch', {
                  value: val,
                  writable: true,
                  configurable: true,
                  enumerable: true
                });
              },
              configurable: true,
              enumerable: desc.enumerable !== false
            });
          }
        } catch (e) {
          // fallback ignore
        }
      })();
    </script>
